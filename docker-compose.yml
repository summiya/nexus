services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      LITELLM_LOCAL_MODEL_COST_MAP: ${LITELLM_LOCAL_MODEL_COST_MAP:-True}
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      API_VERSION: ${API_VERSION}
      API_PREFIX: ${API_PREFIX}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
      SIGNUP_OTP_TTL_SECONDS: ${SIGNUP_OTP_TTL_SECONDS}
      SIGNUP_OTP_MAX_ATTEMPTS: ${SIGNUP_OTP_MAX_ATTEMPTS}
      SIGNUP_OTP_LENGTH: ${SIGNUP_OTP_LENGTH}
      SIGNUP_OTP_RATE_LIMIT_WINDOW_SECONDS: ${SIGNUP_OTP_RATE_LIMIT_WINDOW_SECONDS}
      SIGNUP_OTP_RATE_LIMIT_MAX_REQUESTS: ${SIGNUP_OTP_RATE_LIMIT_MAX_REQUESTS}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      RESEND_API_KEY: ${RESEND_API_KEY}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      ACCESS_TOKEN_EXPIRES_SECONDS: ${ACCESS_TOKEN_EXPIRES_SECONDS}
      REFRESH_TOKEN_EXPIRES_SECONDS: ${REFRESH_TOKEN_EXPIRES_SECONDS}
      AUTH_TOKEN_ISSUER: ${AUTH_TOKEN_ISSUER}
      CONVERSATION_HISTORY_LIMIT: ${CONVERSATION_HISTORY_LIMIT:-50}
      CONVERSATION_HISTORY_MAX_CHARS: ${CONVERSATION_HISTORY_MAX_CHARS:-120000}
      CONVERSATION_MESSAGE_MAX_LENGTH: ${CONVERSATION_MESSAGE_MAX_LENGTH:-32000}
      FILE_UPLOAD_MAX_SIZE_BYTES: ${FILE_UPLOAD_MAX_SIZE_BYTES:-536870912}
      MODEL_PROVIDER_VALIDATION_TIMEOUT_SECONDS: ${MODEL_PROVIDER_VALIDATION_TIMEOUT_SECONDS:-10}
      MODEL_PROVIDER_VALIDATION_RATE_LIMIT_MAX_REQUESTS: ${MODEL_PROVIDER_VALIDATION_RATE_LIMIT_MAX_REQUESTS:-1}
      MODEL_PROVIDER_VALIDATION_RATE_LIMIT_WINDOW_SECONDS: ${MODEL_PROVIDER_VALIDATION_RATE_LIMIT_WINDOW_SECONDS:-5}
      MODEL_PROVIDER_VALIDATION_ORGANIZATION_RATE_LIMIT_MAX_REQUESTS: ${MODEL_PROVIDER_VALIDATION_ORGANIZATION_RATE_LIMIT_MAX_REQUESTS:-20}
      MODEL_PROVIDER_VALIDATION_ORGANIZATION_RATE_LIMIT_WINDOW_SECONDS: ${MODEL_PROVIDER_VALIDATION_ORGANIZATION_RATE_LIMIT_WINDOW_SECONDS:-60}
      MODEL_PROVIDER_DISCOVERY_TIMEOUT_SECONDS: ${MODEL_PROVIDER_DISCOVERY_TIMEOUT_SECONDS:-15}
      MODEL_PROVIDER_DISCOVERY_RATE_LIMIT_MAX_REQUESTS: ${MODEL_PROVIDER_DISCOVERY_RATE_LIMIT_MAX_REQUESTS:-2}
      MODEL_PROVIDER_DISCOVERY_RATE_LIMIT_WINDOW_SECONDS: ${MODEL_PROVIDER_DISCOVERY_RATE_LIMIT_WINDOW_SECONDS:-10}
      MODEL_PROVIDER_DISCOVERY_ORGANIZATION_RATE_LIMIT_MAX_REQUESTS: ${MODEL_PROVIDER_DISCOVERY_ORGANIZATION_RATE_LIMIT_MAX_REQUESTS:-10}
      MODEL_PROVIDER_DISCOVERY_ORGANIZATION_RATE_LIMIT_WINDOW_SECONDS: ${MODEL_PROVIDER_DISCOVERY_ORGANIZATION_RATE_LIMIT_WINDOW_SECONDS:-60}
      MODEL_PROVIDER_RUNTIME_TIMEOUT_SECONDS: ${MODEL_PROVIDER_RUNTIME_TIMEOUT_SECONDS:-120}
      FILE_UPLOAD_GRANT_TTL_SECONDS: ${FILE_UPLOAD_GRANT_TTL_SECONDS:-600}
      FILE_UPLOAD_CONTEXT_KEY: ${FILE_UPLOAD_CONTEXT_KEY}
      STORAGE_PROVIDER: azure_blob
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-nexus-files}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_PUBLIC_BLOB_BASE_URL: ${AZURE_STORAGE_PUBLIC_BLOB_BASE_URL}
      AZURE_STORAGE_LOCAL_EMULATOR_ENABLED: ${AZURE_STORAGE_LOCAL_EMULATOR_ENABLED:-true}
      CREDENTIAL_STORE_PROVIDER: ${CREDENTIAL_STORE_PROVIDER:-}
      LOCAL_CREDENTIAL_STORE_PATH: ${LOCAL_CREDENTIAL_STORE_PATH:-}
      LOCAL_CREDENTIAL_STORE_KEY: ${LOCAL_CREDENTIAL_STORE_KEY:-}
      AZURE_KEY_VAULT_URL: ${AZURE_KEY_VAULT_URL:-}
      AZURE_KEY_VAULT_MANAGED_IDENTITY_CLIENT_ID: ${AZURE_KEY_VAULT_MANAGED_IDENTITY_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, urllib.request, sys; response = urllib.request.urlopen('http://127.0.0.1:8000${API_PREFIX}/health', timeout=5); payload = json.loads(response.read().decode()); sys.exit(0 if payload.get('status') == 'ok' else 1)\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network
    volumes:
      - provider-credential-data:/var/lib/nexus/provider-credentials

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_APP_ENV: ${VITE_APP_ENV}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexus-network

  postgres:
    image: postgres:16-alpine
    ports:
    - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data
    networks:
      - nexus-network

  file-worker:
    profiles: ["azure-emulators"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m nexus.dev.local_file_worker
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL}
      FILE_UPLOAD_MAX_SIZE_BYTES: ${FILE_UPLOAD_MAX_SIZE_BYTES:-536870912}
      FILE_UPLOAD_CONTEXT_KEY: ${FILE_UPLOAD_CONTEXT_KEY}
      FILE_WORKER_DATABASE_POOL_SIZE: ${FILE_WORKER_DATABASE_POOL_SIZE:-2}
      FILE_WORKER_DATABASE_MAX_OVERFLOW: ${FILE_WORKER_DATABASE_MAX_OVERFLOW:-0}
      FILE_WORKER_MAX_LOCK_RENEWAL_SECONDS: ${FILE_WORKER_MAX_LOCK_RENEWAL_SECONDS:-300}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-nexus-files}
      AZURE_STORAGE_ACCOUNT_NAME: devstoreaccount1
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_SERVICE_BUS_CONNECTION_STRING: ${AZURE_SERVICE_BUS_CONNECTION_STRING}
      AZURE_SERVICE_BUS_QUEUE_NAME: file-upload-completions
      AZURE_SERVICE_BUS_MALWARE_SCAN_QUEUE_NAME: file-malware-scan-results
      AZURE_EVENT_GRID_EXPECTED_SOURCE: /local/azurite
      AZURE_MALWARE_SCAN_EXPECTED_TOPIC: /local/defender
      FILE_UPLOAD_COMPLETION_SOURCE: local-azurite
      FILE_MALWARE_SCAN_SOURCE: local-malware-simulator
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
      servicebus-emulator:
        condition: service_started
    networks:
      - nexus-network


  file-event-simulator:
    profiles: ["azure-emulators"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "nexus.dev.local_file_events"]
    environment:
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-nexus-files}
      AZURE_STORAGE_ACCOUNT_NAME: devstoreaccount1
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_SERVICE_BUS_CONNECTION_STRING: ${AZURE_SERVICE_BUS_CONNECTION_STRING}
    depends_on:
      azurite:
        condition: service_started
      servicebus-emulator:
        condition: service_started
    networks:
      - nexus-network

  servicebus-emulator:
    profiles: ["azure-emulators"]
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      - ./infra/servicebus/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    environment:
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: ${SERVICE_BUS_EMULATOR_SQL_PASSWORD}
      ACCEPT_EULA: ${SERVICE_BUS_EMULATOR_ACCEPT_EULA:-N}
      EMULATOR_HTTP_PORT: 5300
    depends_on:
      - servicebus-sql
    networks:
      - nexus-network

  servicebus-sql:
    profiles: ["azure-emulators"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: ${SERVICE_BUS_EMULATOR_ACCEPT_EULA:-N}
      MSSQL_SA_PASSWORD: ${SERVICE_BUS_EMULATOR_SQL_PASSWORD}
    networks:
      - nexus-network


networks:
  nexus-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  azurite-data:
  provider-credential-data:
