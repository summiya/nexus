services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_NAME: NEXUS
      API_VERSION: v1
      ENVIRONMENT: development
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json, urllib.request, sys; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); payload = json.loads(response.read().decode()); sys.exit(0 if payload.get('status') == 'ok' else 1)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge
