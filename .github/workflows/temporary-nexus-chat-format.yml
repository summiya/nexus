name: Temporary NEXUS chat frontend formatter

on:
  push:
    branches:
      - feat/nexus-authenticated-chat-redesign

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Format changed chat files
        working-directory: frontend
        run: |
          npx prettier --write \
            src/features/conversations/ConversationSidebar.tsx \
            src/features/conversations/ConversationSidebar.test.tsx \
            src/features/conversations/ConversationComposer.tsx \
            src/pages/ConversationPage.tsx \
            src/pages/ConversationPage.test.tsx \
            src/styles/nexus-chat-experience.css
      - name: Commit formatting
        run: |
          set -euo pipefail
          git add frontend/src/features/conversations/ConversationSidebar.tsx \
            frontend/src/features/conversations/ConversationSidebar.test.tsx \
            frontend/src/features/conversations/ConversationComposer.tsx \
            frontend/src/pages/ConversationPage.tsx \
            frontend/src/pages/ConversationPage.test.tsx \
            frontend/src/styles/nexus-chat-experience.css
          if git diff --cached --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(frontend): format authenticated NEXUS chat redesign'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
