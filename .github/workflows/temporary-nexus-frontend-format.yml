name: Temporary NEXUS frontend formatter

on:
  push:
    branches:
      - feat/nexus-landing-login-experience

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install formatting dependencies
        working-directory: frontend
        run: npm ci
      - name: Format only the new NEXUS experience files
        working-directory: frontend
        run: |
          npx prettier --write \
            src/pages/HomePage.tsx \
            src/pages/HomePage.test.tsx \
            src/styles/nexus-experience.css \
            src/features/auth/LoginPage.tsx
      - name: Commit formatting changes on the feature branch
        run: |
          set -euo pipefail
          git add frontend/src/pages/HomePage.tsx frontend/src/pages/HomePage.test.tsx frontend/src/styles/nexus-experience.css frontend/src/features/auth/LoginPage.tsx
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(frontend): apply Prettier to NEXUS experience"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
