name: Temporary NEXUS dashboard formatter

on:
  push:
    branches:
      - feat/nexus-unified-workspace-dashboard

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Format updated dashboard files
        working-directory: frontend
        run: |
          npx prettier --write \
            src/components/dashboard/DashboardIcon.tsx \
            src/components/AppLayout.tsx \
            src/pages/WorkspaceDashboardPages.tsx \
            src/pages/WorkspaceDashboardPages.test.tsx \
            src/pages/AccountSettingsSection.tsx \
            src/pages/AccountSettingsSection.test.tsx \
            src/pages/SettingsPage.tsx \
            src/pages/FilesPage.tsx \
            src/features/model-providers/AIProvidersSettings.tsx \
            src/features/model-management/AIModelsSettings.tsx \
            src/features/files/FileUploadPanel.tsx \
            src/features/files/FileUploadPanel.test.tsx \
            src/features/files/FileLibrary.tsx \
            src/features/files/FileLibrary.test.tsx \
            src/app/router.tsx \
            src/App.test.tsx \
            styles/nexus-dashboard.css \
            styles/nexus-dashboard-pages.css \
            tests/e2e/app.smoke.spec.ts
      - name: Commit formatting
        run: |
          set -euo pipefail
          git add frontend/src frontend/tests/e2e/app.smoke.spec.ts
          if git diff --cached --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(frontend): format unified dashboard'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
