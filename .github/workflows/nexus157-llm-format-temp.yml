name: NEXUS-157 LLM formatter

on:
  push:
    branches:
      - feat/nexus-157-provider-model-domain

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Apply touched LLM formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nexus-157-provider-model-domain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format touched LLM files
        run: |
          python -m pip install ruff==0.16.7
          ruff format             backend/src/nexus/llm/domain/__init__.py             backend/tests/unit/llm/test_contracts.py
      - name: Commit formatter output and remove temporary workflow
        run: |
          rm .github/workflows/nexus157-llm-format-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply touched LLM formatting"
          git push
