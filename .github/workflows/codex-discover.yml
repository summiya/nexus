name: Codex Ready Discovery

on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run discovery (no execution)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -c "import automation.codex.entrypoint as e; print('discovery entrypoint available')"
