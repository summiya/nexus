name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus
      NEXUS_REQUIRE_AZURITE_TESTS: "true"
      NEXUS_REQUIRE_POSTGRES_TESTS: "true"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0
        ports:
          - 10000:10000

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Prepare backend configuration
        run: cp .env.example .env

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for Azurite
        run: |
          python - <<'PY'
          import socket
          import time

          deadline = time.monotonic() + 30
          while True:
              try:
                  with socket.create_connection(("127.0.0.1", 10000), timeout=1):
                      break
              except OSError:
                  if time.monotonic() >= deadline:
                      raise SystemExit("Azurite did not become ready within 30 seconds")
                  time.sleep(1)
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: pip install ".[dev]"

      - name: Backend Unit Tests
        working-directory: backend
        run: pytest tests/unit -q

      - name: Backend API Tests
        working-directory: backend
        run: pytest tests/api -q

      - name: Backend Integration Tests
        working-directory: backend
        run: pytest tests/integration -q

      - name: Backend coverage
        working-directory: backend
        run: pytest tests --cov=nexus --cov-branch --cov-report=term-missing -q

      - name: Run Ruff
        working-directory: backend
        run: ruff check src tests

      - name: Run mypy
        working-directory: backend
        run: mypy src

      - name: Run pre-commit
        run: pre-commit run --all-files

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Prepare frontend configuration
        run: cp .env.example .env

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend format check
        working-directory: frontend
        run: npm run format:check

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Frontend production build
        working-directory: frontend
        run: |
          set -a
          source ../.env
          set +a
          npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend browser smoke test
        working-directory: frontend
        run: npm run test:e2e

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Prepare Docker configuration
        run: cp .env.example .env

      - name: Build Docker images
        run: docker compose build
