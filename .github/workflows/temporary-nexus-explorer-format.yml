name: Temporary NEXUS Explorer formatting

on:
  push:
    branches:
      - feat/nexus-explorer-capability-showcase

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Format Explorer and homepage
        working-directory: frontend
        run: |
          npx prettier --write \
            src/pages/HomePage.tsx \
            src/features/marketing/NexusCapabilityExplorer.tsx \
            src/features/marketing/NexusCapabilityExplorer.test.tsx \
            src/styles/nexus-capability-explorer.css
      - name: Commit formatting to feature branch
        run: |
          set -euo pipefail
          git add frontend/src/pages/HomePage.tsx \
            frontend/src/features/marketing/NexusCapabilityExplorer.tsx \
            frontend/src/features/marketing/NexusCapabilityExplorer.test.tsx \
            frontend/src/styles/nexus-capability-explorer.css
          if git diff --cached --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(frontend): format Explorer capability showcase'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
