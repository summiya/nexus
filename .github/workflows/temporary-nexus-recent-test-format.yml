name: Temporary recent chat test formatter

on:
  push:
    branches:
      - feat/nexus-unified-workspace-dashboard

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Format new recent chat assertion
        working-directory: frontend
        run: npx prettier --write src/components/dashboard/RecentConversationsMenu.test.tsx
      - name: Commit formatting
        run: |
          set -euo pipefail
          git add frontend/src/components/dashboard/RecentConversationsMenu.test.tsx
          if git diff --cached --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(frontend): format recent chat assertion'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
