name: Temporary RF-05 formatter

on:
  push:
    branches:
      - feat/rf05-chunk-embedding-persistence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff installation
        run: python -m pip install ruff==0.16.7
      - name: Ruff formatting
        working-directory: backend
        run: |
          ruff check --fix src/nexus/retrieval/domain/chunk_embeddings.py src/nexus/retrieval/ports src/nexus/infrastructure/persistence/chunk_embedding.py src/nexus/infrastructure/persistence/_chunk_embedding_queries.py tests/unit/retrieval/test_chunk_embedding_batch.py tests/integration/persistence/test_chunk_embedding_persistence.py
          ruff format src/nexus/retrieval/domain/chunk_embeddings.py src/nexus/retrieval/ports src/nexus/infrastructure/persistence/chunk_embedding.py src/nexus/infrastructure/persistence/_chunk_embedding_queries.py tests/unit/retrieval/test_chunk_embedding_batch.py tests/integration/persistence/test_chunk_embedding_persistence.py
      - name: Emit formatted source for safe commit
        working-directory: backend
        run: |
          for path in src/nexus/retrieval/domain/chunk_embeddings.py src/nexus/retrieval/ports/chunk_embedding_persistence.py src/nexus/retrieval/ports/__init__.py src/nexus/infrastructure/persistence/_chunk_embedding_queries.py src/nexus/infrastructure/persistence/chunk_embedding.py tests/unit/retrieval/test_chunk_embedding_batch.py tests/integration/persistence/test_chunk_embedding_persistence.py; do
            printf 'RF05_FORMAT_BLOB:%s:%s\n' "$path" "$(base64 -w0 "$path")"
          done
