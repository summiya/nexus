[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS application foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17.0,<2.0.0",
  "azure-servicebus>=7.14.3,<8.0.0",
  "azure-storage-blob[aio]>=12.30.3,<13.0.0",
  "azure-identity>=1.25.3,<2.0.0",
  "cryptography>=46.0.0,<47.0.0",
  "fastapi>=0.140.13",
  "litellm>=1.80.0,<2.0.0",
  "psycopg[binary]>=3.3.0,<4.0.0",
  "PyJWT>=2.9.0,<3.0.0",
  "uvicorn>=0.30.0",
  "pydantic-settings>=2.2.1",
  "redis>=5.0.0,<6.0.0",
  "resend>=2.0.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.53,<3.0.0",
  "structlog>=25.4.0,<26.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff==0.16.7",
  "mypy>=1.15.0",
  "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nexus"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexus*"]

[tool.ruff]
src = ["src"]
exclude = ["build"]

[tool.ruff.lint.isort]
known-first-party = ["nexus"]
