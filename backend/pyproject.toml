[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS application foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17.0,<2.0.0",
  "fastapi>=0.111.0",
  "psycopg[binary]>=3.3.0,<4.0.0",
  "uvicorn>=0.30.0",
  "pydantic-settings>=2.2.1",
  "redis>=5.0.0,<6.0.0",
  "sqlalchemy>=2.0.53,<3.0.0",
  "structlog>=25.4.0,<26.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff==0.16.7",
  "mypy>=1.15.0",
  "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nexus"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexus*"]

[tool.ruff]
src = ["src"]
exclude = ["build"]

[tool.ruff.lint.isort]
known-first-party = ["nexus"]
