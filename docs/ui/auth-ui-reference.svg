<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<rect width="1600" height="1050" fill="#f7f7f8"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#171717}.title{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:600}.body{font-size:16px}.muted{font-size:14px;fill:#666}.btn{font-size:16px;font-weight:700;fill:white}</style>
<text x="70" y="60" class="title">NEXUS Authentication — Visual Reference</text>
<!-- landing -->
<rect x="60" y="100" width="720" height="410" rx="20" fill="white" stroke="#ddd"/>
<text x="90" y="145" class="label">01 · Public Landing</text>
<text x="110" y="205" class="title">NEXUS</text>
<text x="110" y="255" font-size="42" font-weight="700">Your AI workspace.</text>
<text x="110" y="292" font-size="22">Think, create and work in one place.</text>
<rect x="110" y="335" width="170" height="50" rx="10" fill="#171717"/><text x="145" y="367" class="btn">Get Started</text>
<text x="110" y="420" class="muted">Secure passwordless access · Email OTP</text>
<text x="650" y="145" class="muted">Sign In</text>
<!-- auth -->
<rect x="820" y="100" width="720" height="410" rx="20" fill="white" stroke="#ddd"/>
<text x="850" y="145" class="label">02 · Signup / Login</text>
<text x="900" y="205" class="title">Welcome to NEXUS</text>
<text x="900" y="235" class="muted">We'll send a secure one-time code.</text>
<text x="900" y="285" class="label">Work email</text>
<rect x="900" y="300" width="500" height="48" rx="8" fill="white" stroke="#bbb"/>
<text x="920" y="330" class="muted">you@example.com</text>
<rect x="900" y="370" width="500" height="50" rx="10" fill="#171717"/><text x="1080" y="402" class="btn">Continue</text>
<text x="900" y="455" class="muted">New to NEXUS? Create your workspace</text>
<!-- otp -->
<rect x="60" y="550" width="720" height="430" rx="20" fill="white" stroke="#ddd"/>
<text x="90" y="595" class="label">03 · Email OTP Verification</text>
<text x="160" y="665" class="title">Check your email</text>
<text x="160" y="695" class="muted">Enter the verification code we sent you.</text>
<g fill="white" stroke="#aaa"><rect x="160" y="730" width="58" height="58" rx="8"/><rect x="230" y="730" width="58" height="58" rx="8"/><rect x="300" y="730" width="58" height="58" rx="8"/><rect x="370" y="730" width="58" height="58" rx="8"/><rect x="440" y="730" width="58" height="58" rx="8"/><rect x="510" y="730" width="58" height="58" rx="8"/></g>
<rect x="160" y="815" width="408" height="48" rx="10" fill="#171717"/><text x="320" y="845" class="btn">Verify</text>
<text x="160" y="900" class="muted">Resend code · Change email</text>
<!-- shell -->
<rect x="820" y="550" width="720" height="430" rx="20" fill="white" stroke="#ddd"/>
<text x="850" y="595" class="label">04 · Authenticated NEXUS Workspace</text>
<rect x="850" y="625" width="190" height="325" rx="12" fill="#f2f2f3"/>
<text x="875" y="660" font-size="22" font-weight="700">NEXUS</text>
<rect x="870" y="680" width="150" height="42" rx="9" fill="#171717"/><text x="900" y="707" class="btn">+ New Chat</text>
<text x="875" y="755" class="body">Chats</text><text x="875" y="790" class="body">Projects</text><text x="875" y="825" class="body">Knowledge</text><text x="875" y="860" class="body">Files</text><text x="875" y="895" class="body">Tools</text>
<text x="1070" y="700" font-size="30" font-weight="700">Welcome to NEXUS</text>
<text x="1070" y="735" class="muted">Your AI workspace</text>
<rect x="1070" y="850" width="410" height="52" rx="12" fill="white" stroke="#bbb"/><text x="1090" y="882" class="muted">Message NEXUS…</text>
<circle cx="1460" cy="875" r="20" fill="#171717"/><text x="1452" y="881" font-size="14" fill="white">→</text>
</svg>